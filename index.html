<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الحصة السريع - Classroom</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style> body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; } </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="font-black text-lg">⚡ مساعد الحصة (Classroom 🌐)</h1>
            <p class="text-[11px] text-indigo-200">مربوط بالكامل مع Supabase Cloud</p>
        </div>
        <div class="text-left bg-indigo-700 px-3 py-1 rounded-xl">
            <span class="text-[10px] text-indigo-200 block">حصيلة اليوم</span>
            <span id="todayTotal" class="font-black text-emerald-300 text-sm">0 ج.م</span>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="flex border-b bg-white text-xs font-bold text-center">
        <button onclick="switchTab('session')" id="tabSession" class="flex-1 py-3 text-indigo-600 border-b-2 border-indigo-600">📖 الحصة الحالية</button>
        <button onclick="switchTab('students')" id="tabStudents" class="flex-1 py-3 text-slate-500">👥 إدارة الطلاب</button>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="p-4 max-w-lg mx-auto">

        <!-- TAB 1: SESSION MODE -->
        <section id="secSession" class="space-y-4">
            <div class="bg-white p-3 rounded-2xl shadow-sm border space-y-2">
                <label class="block text-xs font-bold text-slate-600">اختر المجموعة:</label>
                <select id="sessionGroupSelect" onchange="renderSessionList()" class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs font-bold text-slate-800 outline-none"></select>
            </div>

            <!-- Stats Bar -->
            <div class="grid grid-cols-3 gap-2 text-center text-xs font-bold">
                <div class="bg-emerald-50 text-emerald-700 border border-emerald-200 p-2 rounded-xl">
                    <span class="block text-[10px] text-slate-500">حضر</span>
                    <span id="countPresent" class="text-sm font-black">0</span>
                </div>
                <div class="bg-red-50 text-red-700 border border-red-200 p-2 rounded-xl">
                    <span class="block text-[10px] text-slate-500">غاب</span>
                    <span id="countAbsent" class="text-sm font-black">0</span>
                </div>
                <div class="bg-amber-50 text-amber-700 border border-amber-200 p-2 rounded-xl">
                    <span class="block text-[10px] text-slate-500">لم يدفع</span>
                    <span id="countUnpaid" class="text-sm font-black">0</span>
                </div>
            </div>

            <div id="sessionStudentsList" class="space-y-3">
                <p class="text-center text-xs text-slate-400 py-6">جاري تحميل البيانات من قاعدة البيانات...</p>
            </div>
        </section>

        <!-- TAB 2: STUDENTS MANAGEMENT -->
        <section id="secStudents" class="space-y-4 hidden">
            <form onsubmit="addStudent(event)" class="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
                <h3 class="font-black text-xs text-slate-800">➕ إضافة طالب جديد</h3>
                <input type="text" id="stdName" placeholder="اسم الطالب" required class="w-full border rounded-xl p-2.5 text-xs font-bold bg-slate-50 outline-none">
                <div class="grid grid-cols-2 gap-2">
                    <input type="tel" id="stdPhone" placeholder="رقم ولي الأمر (واتساب)" required class="w-full border rounded-xl p-2.5 text-xs font-bold bg-slate-50 outline-none">
                    <input type="number" id="stdFee" placeholder="المبلغ (ج.م)" value="60" required class="w-full border rounded-xl p-2.5 text-xs font-bold bg-slate-50 outline-none">
                </div>
                <input type="text" id="stdGroup" placeholder="المجموعة (مثال: ثانوية - سنتر الأمل)" required class="w-full border rounded-xl p-2.5 text-xs font-bold bg-slate-50 outline-none">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs transition">حفظ في قاعدة البيانات ☁️</button>
            </form>

            <div id="allStudentsList" class="space-y-2"></div>
        </section>

    </main>

    <script>
        // 🔗 بيانات مشروعك الخاصة بـ Supabase
        const SUPABASE_URL = "https://wboqplduhcwkpgffaqrh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_6ZO3naWz7EAT5faaFP45VQ_MdgF9L94";

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let students = [];
        let todayData = {};
        const todayDate = new Date().toISOString().split('T')[0];

        async function loadData() {
            try {
                // 1. جلب الطلاب
                const { data: stdData, error: stdErr } = await _supabase.from('students').select('*');
                if (stdErr) throw stdErr;
                students = stdData || [];

                // 2. جلب سجل الحضور لليوم
                const { data: attData, error: attErr } = await _supabase.from('attendance').select('*').eq('date', todayDate);
                if (attErr) throw attErr;
                
                todayData = {};
                (attData || []).forEach(row => {
                    todayData[row.student_id] = row;
                });

                updateGroupsDropdown();
                renderAll();
            } catch (err) {
                console.error("خطأ في جلب البيانات:", err);
            }
        }

        async function addStudent(e) {
            e.preventDefault();
            const newStudent = {
                name: document.getElementById('stdName').value,
                phone: document.getElementById('stdPhone').value.replace(/[^0-9]/g, ''),
                group: document.getElementById('stdGroup').value,
                fee: Number(document.getElementById('stdFee').value) || 0
            };

            const { error } = await _supabase.from('students').insert([newStudent]);
            if(error) {
                alert('حدث خطأ أثناء الحفظ! تأكد من أنك قمت بإنشاء الجداول في SQL Editor في لوحة Supabase.');
                console.error(error);
                return;
            }

            e.target.reset();
            alert('تم حفظ الطالب أونلاين بنجاح!');
            loadData();
        }

        async function deleteStudent(id) {
            if(confirm('هل تريد مسح الطالب؟')) {
                await _supabase.from('students').delete().eq('id', id);
                loadData();
            }
        }

        async function toggleAttendance(studentId, status) {
            const current = todayData[studentId] || { student_id: studentId, status: null, paid: false, date: todayDate };
            current.status = status;
            
            await _supabase.from('attendance').upsert([current], { onConflict: 'student_id,date' });
            loadData();
        }

        async function togglePaid(studentId) {
            const current = todayData[studentId] || { student_id: studentId, status: null, paid: false, date: todayDate };
            current.paid = !current.paid;

            await _supabase.from('attendance').upsert([current], { onConflict: 'student_id,date' });
            loadData();
        }

        function switchTab(tab) {
            document.getElementById('secSession').classList.toggle('hidden', tab !== 'session');
            document.getElementById('secStudents').classList.toggle('hidden', tab !== 'students');
            document.getElementById('tabSession').className = tab === 'session' ? 'flex-1 py-3 text-indigo-600 border-b-2 border-indigo-600' : 'flex-1 py-3 text-slate-500';
            document.getElementById('tabStudents').className = tab === 'students' ? 'flex-1 py-3 text-indigo-600 border-b-2 border-indigo-600' : 'flex-1 py-3 text-slate-500';
        }

        function updateGroupsDropdown() {
            const groups = [...new Set(students.map(s => s.group))];
            const select = document.getElementById('sessionGroupSelect');
            if(groups.length === 0) {
                select.innerHTML = '<option>لا توجد مجموعات حالياً</option>';
            } else {
                select.innerHTML = groups.map(g => `<option value="${g}">${g}</option>`).join('');
            }
        }

        function sendWhatsApp(phone, studentName, type) {
            let msg = type === 'absent' ? 
                `السلام عليكم ولي أمر الطالب/ة (${studentName})، نحيطكم علماً بغيابه اليوم عن الحصة.` :
                `السلام عليكم ولي أمر الطالب/ة (${studentName})، نود تذكيركم بالمستحقات المتبقية للحصة.`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function renderSessionList() {
            const selectedGroup = document.getElementById('sessionGroupSelect').value;
            const groupStudents = students.filter(s => s.group === selectedGroup);
            const container = document.getElementById('sessionStudentsList');
            container.innerHTML = '';

            if (groupStudents.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-slate-400 py-6">لا يوجد طلاب في هذه المجموعة</p>`;
                return;
            }

            let presentCount = 0, absentCount = 0, unpaidCount = 0, totalCash = 0;

            groupStudents.forEach(s => {
                const state = todayData[s.id] || { status: null, paid: false };
                if(state.status === 'present') presentCount++;
                if(state.status === 'absent') absentCount++;
                if(state.paid) totalCash += s.fee;
                if(!state.paid && state.status === 'present') unpaidCount++;

                container.innerHTML += `
                    <div class="bg-white border rounded-2xl p-3 shadow-sm flex flex-col gap-2">
                        <div class="flex justify-between items-center">
                            <div>
                                <h4 class="font-bold text-xs text-slate-800">${s.name}</h4>
                                <span class="text-[10px] text-slate-400">💰 ${s.fee} ج.م</span>
                            </div>
                            <button onclick="sendWhatsApp('${s.phone}', '${s.name}', 'absent')" class="text-[10px] bg-emerald-50 text-emerald-700 px-2 py-1 rounded-lg border border-emerald-200 font-bold">💬 واتساب</button>
                        </div>
                        <div class="grid grid-cols-3 gap-2 text-xs font-bold pt-1 border-t">
                            <button onclick="toggleAttendance(${s.id}, 'present')" class="py-1.5 rounded-xl ${state.status === 'present' ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'}">
                                ${state.status === 'present' ? '✅ حضر' : 'حضر'}
                            </button>
                            <button onclick="toggleAttendance(${s.id}, 'absent')" class="py-1.5 rounded-xl ${state.status === 'absent' ? 'bg-red-600 text-white' : 'bg-slate-100 text-slate-600'}">
                                ${state.status === 'absent' ? '❌ غاب' : 'غاب'}
                            </button>
                            <button onclick="togglePaid(${s.id})" class="py-1.5 rounded-xl ${state.paid ? 'bg-indigo-600 text-white' : 'bg-amber-100 text-amber-800'}">
                                ${state.paid ? '💵 دفع' : 'لم يدفع'}
                            </button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('countPresent').innerText = presentCount;
            document.getElementById('countAbsent').innerText = absentCount;
            document.getElementById('countUnpaid').innerText = unpaidCount;
            document.getElementById('todayTotal').innerText = totalCash.toLocaleString('ar-EG') + ' ج.م';
        }

        function renderAll() {
            document.getElementById('allStudentsList').innerHTML = students.map(s => `
                <div class="bg-white border p-3 rounded-xl flex justify-between items-center text-xs">
                    <div>
                        <p class="font-bold text-slate-800">${s.name}</p>
                        <p class="text-[10px] text-slate-400">${s.group} • 📞 ${s.phone}</p>
                    </div>
                    <button onclick="deleteStudent(${s.id})" class="text-red-500 font-bold px-2">مسح</button>
                </div>
            `).join('');

            renderSessionList();
        }

        loadData();
    </script>
</body>
</html>
