<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer subtle ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#accent)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Shield Base -->
  <path d="M256 96L384 144V264C384 340 328 408 256 428C184 408 128 340 128 264V144L256 96Z" fill="#1e293b" stroke="url(#accent)" stroke-width="12" filter="url(#glow)" />

  <!-- Graduation Cap Icon in Center -->
  <polygon points="256,160 352,210 256,260 160,210" fill="url(#accent)" />
  <path d="M192 232V296C192 316 220 336 256 336C292 336 320 316 320 296V232" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <!-- Tassel -->
  <path d="M336 218V280" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
  <circle cx="336" cy="284" r="6" fill="#f59e0b" />

  <!-- Campus Sparkle Nodes -->
  <circle cx="256" cy="210" r="8" fill="#ffffff" />
  <circle cx="216" cy="380" r="4" fill="#14b8a6" />
  <circle cx="296" cy="380" r="4" fill="#8b5cf6" />
</svg>
